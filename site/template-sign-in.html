<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Hypercube UI</title>
<link rel="stylesheet" href="hc/index.css">
<link rel="stylesheet" href="catalog.css">
<script src="theme.js"></script>
</head>
<body class="template">
<div class="cat-bar"><a href="index.html"><svg class="i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Catalog</a><span class="sp"></span><span class="faint">Template: Sign in</span><button class="ibtn" data-theme-toggle aria-label="Switch between light and dark" title="Light or dark"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/></svg></button></div>
<main class="hc-auth" data-sections>
  <form class="hc-auth-card" data-part="email" onsubmit="return false">
    <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#000"/><circle cx="32" cy="32" r="23" fill="#c7ff9f"/><circle cx="32" cy="32" r="11" fill="#000"/></svg>
    <div><h1>Sign in</h1><p>We send a code to your email. No password.</p></div>
    <div class="field"><label class="label" for="e-mail">Email</label><input class="input" id="e-mail" type="email" autocomplete="email" placeholder="you@company.com" required></div>
    <button class="btn btn-primary btn-lg btn-block" data-section="code">Get the code</button>
  </form>
  <form class="hc-auth-card" data-part="code" onsubmit="return false" hidden>
    <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#000"/><circle cx="32" cy="32" r="23" fill="#c7ff9f"/><circle cx="32" cy="32" r="11" fill="#000"/></svg>
    <div><h1>Enter the code</h1><p>We sent 6 digits to your email. It works for 10 minutes.</p></div>
    <div class="field">
      <span class="label" id="c-l">Code</span>
      <div class="hc-code" role="group" aria-labelledby="c-l">
        <input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 1" autocomplete="one-time-code"><input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 2"><input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 3"><input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 4"><input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 5"><input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 6">
      </div>
    </div>
    <button class="btn btn-primary btn-lg btn-block" data-toast="Example: would sign you in">Sign in</button>
    <button class="btn btn-ghost btn-block" type="button" data-section="email"><svg class="i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Use another email</button>
  </form>
</main>

<script src="catalog.js" type="module"></script>
</body>
</html>
